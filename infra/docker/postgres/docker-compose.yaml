services:
  postgres-customer:
    image: postgres:17-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: customer
      POSTGRES_USER: ${POSTGRES_USER_CUSTOMER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_CUSTOMER}

    ports:
      - "5433:5432"

    volumes:
      - ./postgres_customer_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - banking-network

volumes:
  postgres_customer_data: